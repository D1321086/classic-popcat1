<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>POPCAT CLASSIC</title>
        <style>
            body {
                padding: 10px;
                font-family: sans-serif;
            }
            .header-container {
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                background-color: #bdaa90;
            }

            .title {
                width: 80%;
                max-width: 600px;
                margin-top: 2em;
            }
            
            .cat-ing {
                width: 100%;
                flex: 1;
                text-align: center;
                color: #ffffff;
                font-size: 80px;
                -webkit-text-stroke: 3px #000000;
                max-width: 800px;
            }
            
            #p {
                background-image: url('imgs/p.png');
                background-position: bottom center;
                background-size: contain;
                background-repeat: no-repeat;
            }

            #op {
                background-image: url('imgs/op.png');
                background-position: bottom center;
                background-size: contain;
                background-repeat: no-repeat;
                width: 100%;
            }
        </style>
    </head>
    <body>

        <div class="header-container">
            <img class="title" src = "imgs/popcat.svg" alt = "POPCAT CLASSIC" class="title">
            <div class="cat-ing" id="p">0</div>
            <div id="op"></div>
        </div>
        <script>
            let count = 0;
            const countEl = document.getElementById('p');

            console.log(count);

            function increment() {
                count++;
                if (countEl) countEl.textContent = count;
                console.log(count);
            }

            const pImage = "url('imgs/p.png')";
            const opImage = "url('imgs/op.png')";

            function showOpen() {
                if (countEl) countEl.style.backgroundImage = opImage;
            }
            function showClosed() {
                if (countEl) countEl.style.backgroundImage = pImage;
            }

            showClosed();

            const popAudio = new Audio('pops/pop1.mp3');

            if (countEl) {
                countEl.addEventListener('mousedown', function (e) {
                    try { popAudio.currentTime = 0; } catch (err) {}
                    popAudio.play().catch(() => {});
                    increment();
                    showOpen();
                });
            }

            let closeTimeout = null;
            document.addEventListener('mouseup', function () {
                if (closeTimeout) clearTimeout(closeTimeout);
                closeTimeout = setTimeout(function () {
                    showClosed();
                    closeTimeout = null;
                }, 25);
            });

            window.increment = increment;
        </script>
    </body>
</html>
